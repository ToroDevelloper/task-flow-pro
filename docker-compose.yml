services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      DB_SSL_CA_PATH: /app/certs/aiven-ca.pem
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
